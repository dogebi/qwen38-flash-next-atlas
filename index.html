async function auditSafetensors(file){
 if(file.size<10)throw Error(file.name+': too short for a Safetensors header.');
 const lead=await file.slice(0,8).arrayBuffer(),n=new DataView(lead).getBigUint64(0,true);
 if(n<2n||n>67108864n||Number(n)>file.size-8)throw Error(file.name+': invalid or unusually large header (limit 64 MiB).');
 let header;try{header=JSON.parse(await file.slice(8,8+Number(n)).text());}catch(e){throw Error(file.name+': header is not valid JSON.');}
 const base=8+Number(n),intervals=[],groups=Object.create(null),dtypes=Object.create(null),tensors=[];let payload=0;
 for(const [name,w] of Object.entries(header)){if(name==='__metadata__')continue;if(!w||!Array.isArray(w.data_offsets)||w.data_offsets.length!==2||!Array.isArray(w.shape)||typeof w.dtype!=='string')throw Error('Invalid tensor descriptor: '+name);
 const [start,end]=w.data_offsets;if(!Number.isSafeInteger(start)||!Number.isSafeInteger(end)||start<0||end<start||base+end>file.size)throw Error('Out-of-bounds tensor: '+name);
 const b=end-start;intervals.push([start,end]);payload+=b;const group=resolveAuditModule(name);groups[group]=(groups[group]||0)+b;dtypes[w.dtype]=(dtypes[w.dtype]||0)+b;tensors.push({name,dtype:w.dtype,shape:w.shape,bytes:b,module:group});}
 intervals.sort((a,b)=>a[0]-b[0]);let end=0;for(const r of intervals){if(r[0]<end&&r[1]>r[0])throw Error(file.name+': overlapping tensor ranges.');end=Math.max(end,r[1]);}
 return {name:file.name,fileBytes:file.size,headerBytes:base,payloadBytes:payload,otherBytes:file.size-base-payload,groups,dtypes,tensors};
}

function isBlankPanelPoint(e){

 if(!(el instanceof Element)||el.closest('button,a,input,select,textarea,summary,label,[role="button"],[role="tab"],[role="tablist"],[contenteditable="true"],.panel-tabs,.inspector-nav,.inspector-top,.inspector-foot,.timeline,.transport-row,.world-labels,svg'))return false;

 const tree=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let text;
 while((text=tree.nextNode())){if(!text.textContent.trim())continue;const r=document.createRange();r.selectNodeContents(text);for(const b of r.getClientRects())if(e.clientX>=b.left-3&&e.clientX<=b.right+3&&e.clientY>=b.top-2&&e.clientY<=b.bottom+2)return false;}

}

 ${m.owner!==null&&m.owner!==m.index&&html`<button class="text-link" onClick=${()=>this.select('L'+m.owner)}>Open the source layer L${m.owner} <${Icon} name="arrow" size=${14}/></button>`}

${(m.id==='embed'||m.id==='ngram'||m.id==='mixer'||m.id==='mtp')&&html`${m.id==='embed'?html`<${Section} title="Why the n-gram table is the biggest single tensor here"><div class="expert-equation">embed_tokens [248,320 x 2048] 1.27 GB at BF16<br/>lm_head [248,320 x 2048] 1.27 GB at BF16<br/>untied: two independent tables<br/>2.54 GB of the 360 GB file (0.7%)</div><p class="fine">The head and the embedding cover the 248,320 padded vocabulary, and the quantised builds keep both at higher precision, which is why those files shrink faster than their bit width alone suggests.</p><//>`:html`<${Section} title="The parts that are not the hybrid stack"><${Fact} label="n-gram embedding" value="2048 \u2192 64 latent dims"/><${Fact} label="MTP layer" value="64 \u2192 2048"/><${Fact} label="Latent positions" value="262,144 x 2048 = 0 MB at BF16"/><${Fact} label="MTP layer" value="2 linear layers, 16.8 MB at BF16"/><p class="fine">Four modules turn a language backbone into a multimodal model: the bridges move between the 2560-wide residual stream and the 64-dim latent space of the separate VAE, the position table covers the whole context window, and the MTP layer tells the latent stack where it is on the flow-matching trajectory.</p><//>`}`}
${isLayer&&html`<${Section} title="Same weights, different payload">${Object.keys(MODE_INFO).map(mode=>{const b=sumB(m.ws,mode);return html`<div class="ledger-bar"><div><span>${MODE_INFO[mode].label}</span><b>${bytes(b,s.binary)}</b></div><span><i style=${{width:b/sumB(m.ws,'bf16')*100+'%',background:MODE_INFO[mode].color,opacity:mode===s.precision?1:.35}}/></span></div>`;})}<p class="fine">The FP8 build quantises the linear weights with a per-tensor scale; the NVFP4 build packs weights to 4 bits and stores a block scale plus a global scale for each. The embedding, the head and the norms stay wide in both, so the file stops shrinking where the vocabulary begins.</p><//>`}

 ${weights.length>s.limit&&html`<button class="outline-btn full-width" onClick=${()=>this.patch({limit:s.limit+40})}>Show ${weights.length-s.limit} more tensors</button>`}<p class="fine">Click any row or scene label for the operation, input/output shape, and byte arithmetic. Tiny pick dots and leader lines are annotations, not extra stored mass.</p><//>
 <${Section} title="Same weights, different payload">${Object.keys(MODE_INFO).map(mode=>{const b=sumB(m.ws,mode);return html`<div class="ledger-bar"><div><span>${MODE_INFO[mode].label}</span><b>${bytes(b,s.binary)}</b></div><span><i style=${{width:b/sumB(m.ws,'bf16')*100+'%',background:MODE_INFO[mode].color,opacity:mode===s.precision?1:.35}}/></span></div>`;})}<p class="fine">NVFP4 only changes the explicitly targeted backbone routed experts. Ignored tensors retain their source dtypes. BF16 is a hypothetical reference, not a published checkpoint.</p><//></div>`;

renderGuide(){return html`<div><div class="inspect-path">A READING GUIDE TO THE ANIMATION</div><h2 class="editorial">Follow the data.<br/><em>Read the weights.</em></h2><p class="lede">The solids are learned tensors. The moving lights are explanatory signals. Do not read the size of a weight as its runtime workload.</p>
<${Section} title="Start with one block"><p class="guide-copy">Open L00. Twenty-two tensors: the DeltaNet (attention plus a 640-wide FFN), the NDeltaNet (its own attention and FFN), and four norms. Both halves see the same 2560-wide residual stream and the same vocabulary, but they never share a matrix.</p><button class="outline-btn full-width" onClick=${()=>{this.select('L0');this.patch({tab:'inspect'});}}>Open L00: the first Gated DeltaNet + Qwen Sparse Attention block</button><//>
<${Section} title="Compare a deep block"><p class="guide-copy">Now open L47. Byte for byte it is the same block as L00 \u2014 that is the point of a Gated DeltaNet + Qwen Sparse Attention: depth changes the weights, never the shape.</p><button class="outline-btn full-width" onClick=${()=>{this.select('L47');this.patch({tab:'inspect'});}}>Open L47: the last block</button><//>
<${Section} title="Where the 360 GB lives"><p class="guide-copy">The 48 layers are 5.75 GB of the reference. The vocabulary is the next biggest thing: 2.54 GB for the embedding and the head, untied. Then the n-gram table (0 MB) and the MTP layer (16.8 MB).</p><button class="outline-btn full-width" onClick=${()=>{this.select('embed');this.patch({tab:'inspect'});}}>Open the embedding</button><//>
<${Section} title="Then look at the seam"><p class="guide-copy">Open the bridges: n-gram embedding (2048 \u2192 64) and MTP layer (64 \u2192 2048) are a few hundred kilobytes together, and they are the only place where this checkpoint touches the VAE latent space. The decoder itself is a separate 0.531 GB repository.</p><button class="outline-btn full-width" onClick=${()=>{this.select('ngram');this.patch({tab:'inspect'});}}>Open the N-gram + MTP</button><//>
<${Section} title="Three distinctions worth keeping"><div class="layer-story"><h3>Two attention kinds, one stack.</h3><p>The AR and NDeltaNets live side by side in the same 48 layers. Reading one block without the other misses half of what a layer computes.</p><h3>An untied vocabulary is a real cost.</h3><p>248,320 rows appear twice: 2.54 GB at BF16, 0.7% of the file. The quantised builds keep both wide.</p><h3>A quantiser ignores more than it converts.</h3><p>FP8 and NVFP4 both leave the embedding, the head and the norms at higher precision. Read the ledger, not the bit width.</p></div><//>
 <${Section} title="A byte-true view, with limits"><p class="guide-copy">Every solid uses 1 cubic world unit per decimal GB of modeled payload. Its three dimensions multiply to that volume, including throughout the morph. Aspect ratio is chosen for readability; it is not the literal matrix shape. Small picking dots, links and labels carry no bytes.</p><p class="guide-copy">The ledger remains schema-derived. A complete set of checkpoint headers is required before calling its totals exact on-disk measurements.</p><button class="text-link" onClick=${()=>this.patch({modal:'audit'})}>Audit local Safetensors headers <${Icon} name="arrow" size=${14}/></button><//></div>`;}
 renderStorage(){const s=this.state,selected=s.selected&&s.selected.startsWith('cat:')?CATEGORIES.find(c=>'cat:'+c[0]===s.selected):null;return html`<div><div class="inspect-path">PARAMETERS / FORMATS / BYTES</div><h2 class="editorial">Storage, <em>honestly.</em></h2><p class="lede">Mass is conserved as the architecture unfolds. Compare the same logical weights in different formats.</p><div class="storage-total"><small>${MODE_INFO[s.precision].note.toUpperCase()}</small><strong>${bytes(TOTALS[s.precision],s.binary)}</strong><span>Schema-derived tensor payload estimate</span></div>
 <${Note} color=${s.precision==='nvfp4'?COL.dec:COL.enc}><strong>${s.precision==='bf16'?'A reference, not a checkpoint.':EXP[s.precision].title}</strong> ${s.precision==='bf16'?'Every logical value is charged two bytes. This baseline is hypothetical, not an available BF16 repository or a device-memory prediction.':EXP[s.precision].body}<//>
 <${Section} title="Payload by component" tag=${selected?'SELECTED: '+selected[0].toUpperCase():'ALL MODULES'}>${CATEGORIES.map(([id,name,c,ws])=>{let b=sumB(ws,s.precision),active=selected&&selected[0]===id;return html`<button class=${'category-row'+(active?' active':'')} onClick=${()=>this.patch({selected:'cat:'+id})}><div><i style=${{background:c}}/><span>${name}</span><b>${bytes(b,s.binary)}</b></div><span class="mini-track"><i style=${{width:b/TOTALS[s.precision]*100+'%',background:c}}/></span><small>${fmtP(sumP(ws))} parameters <span>${(b/TOTALS[s.precision]*100).toFixed(2)}%</span></small></button>`;})}<//>
<${Section} title="Three precisions, one architecture"><div class="equation"><span>BF16</span><code>2 B / parameter</code><span>FP8</span><code>1 B + per-tensor scale</code><span>NVFP4</span><code>0.5 B + block and global scales</code></div><${Fact} label="FP8 saves" value=${bytes(FP8_DELTA,s.binary)} color=${COL.dec}/><${Fact} label="NVFP4 saves" value=${bytes(NV_DELTA,s.binary)} color=${COL.nar_attn}/><p class="fine">Measured, not projected: 360.0002 GB becomes 185.5233 GB as e4m3 with per-tensor scales, and 132.6802 GB as 4-bit packed weights carrying both a block scale and a global scale each. Both builds keep the embedding, the head and the norms out of the conversion.</p><//>
 <${Section} title="Audit, rather than guess"><p class="fine">The 510 GB upstream listing is consistent with this estimate, but rounded. Inspect local Safetensors headers for exact stored tensor bytes, including scale tensors. No weights are loaded or uploaded.</p><button class="outline-btn full-width" onClick=${()=>this.patch({modal:'audit'})}><${Icon} name="expand" size=${16}/> Audit local checkpoint headers</button><button class="text-link" onClick=${()=>this.exportLedger()}>Export derived tensor ledger <${Icon} name="download" size=${14}/></button><//>
<details class="assumptions"><summary>Accounting assumptions and limits</summary><p>Tensor payload only: shard headers, file padding and exporter metadata are excluded, so these are not download sizes.</p><p>Every quantisation sidecar (weight_scale, weight_global_scale, weight_packed) is folded into the weight it describes, so all three modes list the same logical tensors even though the BF16 shard holds 628 tensors, the FP8 build 507 and the NVFP4 build 703.</p><p>The separate VAE decoder (the vision tower inside this checkpoint) is not part of this checkpoint and is not counted in any total on this page. Cache figures are arithmetic from the published shapes, not measured device memory.</p></details></div>`;}
renderCache(){const s=this.state,n=s.context,full=n*KV_FULL_PER_TOKEN;return html`<div><div class="inspect-path">CONTEXT COST / 12 OF 48 LAYERS CACHE</div><h2 class="editorial">Twelve.<br/><em>Only these twelve cache.</em></h2><p class="lede">36 of the 48 layers are Gated DeltaNet: their state is constant, so 262,144 tokens cost them nothing extra. The 12 Qwen Sparse Attention layers are the only ones that grow a KV cache, and inside them an indexer spends a 512-block budget.</p><div class="storage-total cache-total"><small>KV CACHE / TOKEN</small><strong>49,152 <em>bytes</em></strong><span>12 QSA layers x 2 KV heads x 256 dims x (k+v) x 2 bytes</span></div>
<${Section} title="Stretch the timeline" tag="UP TO 262,144 TOKENS"><label class="range-title" for="context-number">Tokens <input id="context-number" type="number" min="1024" max="262144" step="1024" value=${n} onChange=${e=>{const v=Number(e.target.value);this.patch({context:clamp(Number.isFinite(v)?Math.round(v):1024,1024,262144)});}}/></label><input class="slider" aria-label="Latent frame count logarithmic slider" type="range" min="7" max="18" step="0.05" value=${Math.log2(n)} onInput=${e=>this.patch({context:clamp(Math.round(2**Number(e.target.value)),1024,262144)})}/><div class="range-ends"><span>1K</span><span>32K</span><span>256K</span></div><div class="preset-row">${[8192,32768,131072,262144].map(v=>html`<button class=${n===v?'active':''} onClick=${()=>this.patch({context:v})}>${v===262144?'256K':v/1024+'K'}</button>`)}</div><${Fact} label="KV cache at this length" value=${bytes(full,s.binary)} color=${COL.ar_attn}/><${Fact} label="Recurrent state" value="none \u2014 every layer caches" color=${COL.nar_attn}/><p class="fine">49,152 bytes per latent frame at BF16: 48 layers x 2 KV heads x 128 dims x two tensors x two bytes. At the maximum 262,144 frames the cache alone is 5.64 GB on top of the weights.</p><//>
<${Section} title="Where these numbers come from"><div class="equation"><span>PER LAYER / FRAME</span><code>2 x 8 x 148 x 2 B = 4,096 B</code><span>ALL 28 / FRAME</span><code>4,096 x 28 = 49,152 B</code><span>AT 262,144 FRAMES</span><code>5.64 GB at BF16</code></div><p class="fine">Arithmetic from the published shapes. The n-gram table sets the ceiling: 262,144 frames is the longest timeline this checkpoint was built to read.</p><//>
<${Section} title="What the quantised builds actually cost" tag="MEASURED"><${Fact} label="BF16" value=${bytes(TOTALS.bf16,s.binary)+' / 628 tensors'}/><${Fact} label="FP8" value=${bytes(TOTALS.fp8,s.binary)+' / 507 tensors'}/><${Fact} label="NVFP4" value=${bytes(TOTALS.nvfp4,s.binary)+' / 703 tensors'}/><${Fact} label="Kept wide" value="embedding, head, norms"/><${Fact} label="Not counted here" value="the 27-block vision tower"/><p class="fine">More tensors can mean a smaller file: the NVFP4 build stores a block scale and a global scale for every weight it packs, so its tensor count is the highest of the three while its payload is the lowest.</p><//><${Note} color=${COL.ar_attn}>Cache figures are arithmetic from the published config, not measured device memory. The runtime also holds activations and the flow-matching state, none of which are checkpoint bytes.<//></div>`;}
renderBench(){const s=this.state,b=BENCH[s.bench];return html`<div><div class="inspect-path">PUBLISHER-REPORTED LEADERBOARD / AS PUBLISHED</div><h2 class="editorial">Bytes,<br/><em>not scores.</em></h2><p class="lede">Qwen3.8-Flash-Next has no row in that publisher set: those are the publisher-reported scores the original atlas page carries, reproduced unchanged so this selector matches every other atlas in the series. Qwen3.8-Flash-Next is added as the first row with the figures its own card reports for that benchmark; a blank cell means the card does not publish it. This page measures bytes and publishes no scores of its own.</p><label class="field-label">Compare a benchmark<select value=${s.bench} onChange=${e=>this.patch({bench:Number(e.target.value)})}>${BENCH.map((r,i)=>html`<option value=${i}>${r[0]}</option>`)}</select></label><div class="benchmark-chart">${BENCH_MODELS.map((name,i)=>html`<div class=${'benchmark-row'+(i===0?' featured':'')}><div><span>${name}</span><b>${b[2][i]===null?'Not reported':b[2][i].toFixed(1)}</b></div><div class="bench-track"><i style=${{width:(b[2][i]||0)+'%',background:i===0?COL.dec:COL.enc,opacity:i===0?1:(b[2][i]===null?0.15:0.9)}}/></div></div>`)}</div><p class="fine">${b[0]} / ${b[1]}. Publisher-reported values on each benchmark's own scale, reproduced from the model card's collection; nothing here was measured or evaluated by this page.</p><div class="card-bench"><div class="inspect-path">PUBLISHER CARD / THIS CHECKPOINT</div><p class="card-lede">Every benchmark this checkpoint&rsquo;s own card reports, with the card&rsquo;s own comparison columns, reproduced unchanged. Where a row in the series chart above reads &ldquo;Not reported&rdquo;, the card does not publish that benchmark.</p><div class="card-scroll"><table class="card-table"><thead><tr>${CARD_BENCH.headers.map(h=>html`<th>${h}</th>`)}</tr></thead><tbody>${CARD_BENCH.rows.map(r=>r[0].startsWith("== ")?html`<tr class="sec"><td colSpan=${CARD_BENCH.headers.length}>${r[0].slice(3)}</td></tr>`:html`<tr>${r.map((c,i)=>html`<td class=${i===0?"lbl":(i===1?"num own":"num")}>${c}</td>`)}</tr>`)}</tbody></table></div><p class="fine">Source: <a href="https://huggingface.co/${CARD_BENCH.src}" target="_blank" rel="noopener">${CARD_BENCH.src}</a> model card, retrieved 2026-09-15. Values are the publisher&rsquo;s; this page measures bytes and adds no numbers.</p></div>
<${Section} title="What this page does not do"><${Fact} label="Measured" value="tensor payloads from shard headers"/><${Fact} label="Not measured" value="audio quality, throughput, memory use"/><${Fact} label="Benchmark rows" value="published leaderboard, other models"/><${Fact} label="Model card" value="the authority for capabilities"/><p class="fine">An atlas is an accounting document. It can tell you that the vocabulary is 0.7% of the file and that NVFP4 keeps it wide; it cannot tell you whether the song sounds right.</p><//>

renderSources(){return html`<div><div class="inspect-path">PROVENANCE / MEASURED FROM PUBLISHED SHARDS</div><h2 class="editorial">Trace every<br/><em>assumption.</em></h2><p class="lede">The card supplies the claims. The config supplies the shapes. The shard headers supply the bytes \u2014 all three modes here were read over HTTP Range, not estimated.</p><div class="source-status"><i/> Offline app / no runtime requests</div>

<${Section} title="What each repository actually contains"><p class="fine">The reference is 131 shards and 1658 BF16 tensors: the hybrid attention stacks of all 48 layers, two expert banks and eight gated-residual tensors per layer, the untied vocabulary, the n-gram table in 128 shards, the MTP layer and the 27-block vision tower.</p><${Fact} label="BF16 reference" value=${bytes(TOTALS.bf16,s.binary)+' / 1 shard'}/><${Fact} label="FP8 build" value=${bytes(TOTALS.fp8,s.binary)+' / 1 shard'}/><${Fact} label="NVFP4 build" value=${bytes(TOTALS.nvfp4,s.binary)+' / 1 shard'}/><${Fact} label="VAE decoder" value="0.531 GB / separate repo, not counted"/><//>

<${Section} title="Tower, split and the three modes"><p class="fine">The tower is a logical layer-order view, not a map of safetensors byte offsets. Splitting moves the same 48 layers plus the vocabulary, the bridges, the latent table and the MTP layer into two reading groups; both layouts use the exact same tensor inventory.</p><p class="fine">The animation walks Embed \u2192 DeltaNet \u2192 NDeltaNet \u2192 Bridge \u2192 Decode: the untied vocabulary, the autoregressive half that writes the score, the non-autoregressive half that models latents under a flow-matching timestep, the 64-dim bridge, and the separate VAE decoder. Nothing here executes a model.</p><p class="fine">Training mode is a schematic of the quantisation recipe, not the authors' training code.</p><//>

  'use strict';

  var mc = null;
  try { mc = document.modelContext || (window.navigator && window.navigator.modelContext) || null; } catch (e) { mc = null; }

  // 진단용 상태 노출 — 미지원일 때 조용히 끝나면 원인을 알 수 없으므로 상태를 남긴다.
  var supported = !!(mc && typeof mc.registerTool === 'function');
  window.__WEBMCP_STATUS = supported ? 'pending' : (mc ? 'unsupported-api-shape' : 'unsupported-browser');
  if (!supported) {
    try {
      console.info('[webmcp] document.modelContext 없음 (status=' + window.__WEBMCP_STATUS + '). ' +
        'Chrome 149+ 에서 chrome://flags/#enable-webmcp-testing 을 Enabled 로 바꾸고 브라우저를 재시작한 뒤, ' +
        'Ctrl+Shift+R 로 새로고침하세요. 콘솔에서 typeof document.modelContext 로 확인 가능.');
    } catch (e) {}
    try {
      var probe = (typeof mc.provideContext === 'function'); // API 표면이 provideContext 뿐인 빌드 대비
      if (probe) { window.__WEBMCP_STATUS = 'provideContext-only'; }
    } catch (e) {}
    if (window.__WEBMCP_STATUS !== 'provideContext-only') { return; }
  }

  var ATLAS_WAIT_MS = 12000;

  function atlas() { return window.ATLAS_DEBUG || null; }

  function waitForAtlas(timeoutMs) {
    var t0 = Date.now();
    return new Promise(function (resolve, reject) {
      (function poll() {
        var d = atlas();
        if (d && d.app && d.engine) return resolve(d);
        if (Date.now() - t0 > (timeoutMs || ATLAS_WAIT_MS)) return reject(new Error('ATLAS_DEBUG not ready (atlas still loading)'));
        setTimeout(poll, 200);
      })();
    });
  }

  function num(n) { return (n == null ? 0 : n).toLocaleString('en-US'); }
  function billions(n) { return (n / 1e9).toFixed(2) + 'B'; }
  function bytes(n) { return (n / 1e9).toFixed(1) + ' GB'; }

  function allTensors(d) {
    var out = [];
    for (var i = 0; i < d.MODULES.length; i++) {
      var m = d.MODULES[i];
      var ws = m.ws || [];
      for (var j = 0; j < ws.length; j++) {
        out.push({
          module: m.id,
          module_label: m.label || m.id,
          layer: (m.index == null ? null : m.index),
          part: m.part || null,
          mode: m.mode || null,
          name: ws[j].name,
          shape: ws[j].shape,
          format: ws[j].format,
          cat: ws[j].cat,
          count: ws[j].count,
          params: ws[j].p,
          note: ws[j].note || null
        });
      }
    }
    return out;
  }

  function ok(payload) { return JSON.stringify(payload, null, 1); }
  function err(e) { return JSON.stringify({ error: String((e && e.message) || e) }, null, 1); }

  /* ---- model-card benchmark table (페이지가 window.ATLAS_DEBUG.BENCH 로 노출) ---- */
  var METRIC_NOTE = "Percentages or the card's 0-100 score. ZeroBench uses Pass@5, ProgramBench Almost@1, DeepSWE resolved rate (harness: mini-SWE). Do not average unlike metrics; harnesses vary per benchmark.";

  function benchTable(d) {
    var rows = d && d.BENCH, models = d && d.BENCH_MODELS;
    if (!rows || !models) throw new Error('benchmark table not exposed by this page build (window.ATLAS_DEBUG.BENCH missing)');
    return {
      models: models.slice(),
      rows: rows.map(function (r) { return { name: r[0], category: r[1], values: (r[2] || []).slice() }; })
    };
  }

  function ranked(values, models) {
    var all = [], scored = [], missing = [], i, j;
    for (i = 0; i < models.length; i++) all.push({ model: models[i], score: values[i] == null ? null : values[i] });
    for (i = 0; i < all.length; i++) (all[i].score == null ? missing : scored).push(all[i]);
    scored.sort(function (a, b) { return b.score - a.score; });
    var best = scored.length ? scored[0].score : null;
    for (i = 0; i < scored.length; i++) {
      var above = 0;
      for (j = 0; j < scored.length; j++) if (scored[j].score > scored[i].score) above++;
      scored[i].rank = above + 1;
      scored[i].delta_vs_best = best == null ? null : Math.round((scored[i].score - best) * 10) / 10;
    }
    var out = scored.concat(missing.map(function (r) { return { model: r.model, score: null, note: 'not reported' }; }));
    return { ranking: out, reported: scored.length };
  }

  function findRow(t, want) {
    var w = String(want || '').trim().toLowerCase();
    return t.rows.filter(function (r) { return r.name.toLowerCase() === w; })[0] ||
           t.rows.filter(function (r) { return r.name.toLowerCase().indexOf(w) !== -1; })[0] || null;
  }
  function findModel(ranking, want) {
    var w = String(want || '').trim().toLowerCase();
    return ranking.filter(function (r) { return r.model.toLowerCase() === w; })[0] ||
           ranking.filter(function (r) { return r.model.toLowerCase().indexOf(w) !== -1; })[0] || null;
  }

  var TOOLS = [
    {
      name: 'get_model_overview',
      description: 'Return this atlas model\'s headline facts: model_type, architectures, dtype, total parameter count, per-precision totals (native/nvfp4/bf16), layer count and category summary. Use this first to understand what model is on the page.',
      inputSchema: { type: 'object', properties: {}, additionalProperties: false },
      annotations: { readOnlyHint: true },
      execute: function () {
        return waitForAtlas().then(function (d) {
          var cfg = d.CFG || {};
          var cats = (d.CATEGORIES || []).map(function (c) {
            return { key: c[0], label: c[1], tensors: (c[3] || []).length };
          });
          return ok({
            model_type: cfg.model_type || null,
            architectures: cfg.architectures || null,
            dtype: cfg.dtype || null,
            transformers_version: cfg.transformers_version || null,
            quantization_config: cfg.quantization_config || null,
            total_params: d.TOTAL_P,
            total_params_label: billions(d.TOTAL_P),
            totals_by_precision: d.TOTALS || null,
            layer_modules: d.MODULES.length,
            categories: cats,
            current_precision: d.app.state.precision
          });
        }).catch(err);
      }
    },
    {
      name: 'list_categories',
      description: 'List the atlas tensor categories (e.g. routed experts, attention, vision) with their tensor counts and total parameter counts, so an agent can decide where to look.',
      inputSchema: { type: 'object', properties: {}, additionalProperties: false },
      annotations: { readOnlyHint: true },
      execute: function () {
        return waitForAtlas().then(function (d) {
          var rows = (d.CATEGORIES || []).map(function (c) {
            var ws = c[3] || [], params = 0;
            for (var i = 0; i < ws.length; i++) params += (ws[i].p || 0);
            return { key: c[0], label: c[1], color: c[2], tensors: ws.length, params: params, params_label: billions(params) };
          });
          return ok({ categories: rows, total_tensors: allTensors(d).length });
        }).catch(err);
      }
    },
    {
      name: 'search_tensors',
      description: 'Search weight tensors by name substring, category, or storage format (e.g. "experts.w1", cat "attention", format "fp4"). Returns matching tensor names with shapes, formats, parameter counts and the module/layer they belong to.',
      inputSchema: {
        type: 'object',
        properties: {
          query: { type: 'string', description: 'Substring to match against the tensor name (case-insensitive). Leave empty to match all.' },
          category: { type: 'string', description: 'Exact category key as returned by list_categories (e.g. attention, expert, vision).' },
          format: { type: 'string', description: 'Storage format as reported in the tensor data (e.g. fp8, fp4, bf16).' },
          module: { type: 'string', description: 'Restrict to one module id, e.g. embed or L0.' },
          limit: { type: 'integer', description: 'Max rows to return (default 20, max 200).' }
        },
        additionalProperties: false
      },
      annotations: { readOnlyHint: true },
      execute: function (a) {
        a = a || {};
        return waitForAtlas().then(function (d) {
          var q = (a.query || '').toLowerCase();
          var lim = Math.min(Math.max(parseInt(a.limit, 10) || 20, 1), 200);
          var rows = allTensors(d).filter(function (t) {
            if (q && String(t.name).toLowerCase().indexOf(q) === -1) return false;
            if (a.category && t.cat !== a.category) return false;
            if (a.format && t.format !== a.format) return false;
            if (a.module && t.module !== a.module) return false;
            return true;
          });
          return ok({
            total_matches: rows.length,
            returned: Math.min(rows.length, lim),
            tensors: rows.slice(0, lim).map(function (t) {
              return { name: t.name, module: t.module, cat: t.cat, format: t.format, shape: t.shape, count: t.count, params: t.params };
            })
          });
        }).catch(err);
      }
    },
    {
      name: 'get_tensor_detail',
      description: 'Fetch the full record for one tensor by exact name (as returned by search_tensors), including its shape, storage format, parameter count, and the explanatory note the atlas shows in its inspector panel.',
      inputSchema: {
        type: 'object',
        properties: { name: { type: 'string', description: 'Exact tensor name, e.g. "ffn.experts.w1.weight".' } },
        required: ['name'],
        additionalProperties: false
      },
      annotations: { readOnlyHint: true },
      execute: function (a) {
        a = a || {};
        return waitForAtlas().then(function (d) {
          var name = String(a.name || '');
          var hits = allTensors(d).filter(function (t) { return t.name === name; });
          if (!hits.length) {
            var near = allTensors(d).filter(function (t) { return t.name.indexOf(name) !== -1; }).slice(0, 10);
            return ok({ found: false, requested: name, suggestions: near.map(function (t) { return t.name; }) });
          }
          if (hits.length > 1) {
            return ok({ found: true, ambiguous: true, matches: hits.map(function (t) { return { name: t.name, module: t.module, cat: t.cat, shape: t.shape, format: t.format, count: t.count, params: t.params, note: t.note }; }) });
          }
          return ok({ found: true, tensor: hits[0] });
        }).catch(err);
      }
    },
    {
      name: 'focus_tensor',
      description: 'Navigate the atlas to a tensor so the user sees it highlighted in the 3D view and the inspector panel (uses the page\'s own selection logic). Use after search_tensors/get_tensor_detail. Returns the resulting view state.',
      inputSchema: {
        type: 'object',
        properties: {
          name: { type: 'string', description: 'Tensor name to focus, e.g. "ffn.experts.w1.weight".' },
          module: { type: 'string', description: 'Optional module id to disambiguate (e.g. L0).' }
        },
        required: ['name'],
        additionalProperties: false
      },
      annotations: { readOnlyHint: false, consequentialHint: false },
      execute: function (a) {
        a = a || {};
        return waitForAtlas().then(function (d) {
          var name = String(a.name || '');
          var modId = a.module || null;
          var hit = null;
          var list = allTensors(d);
          for (var i = 0; i < list.length; i++) {
            if (list[i].name === name && (!modId || list[i].module === modId)) { hit = list[i]; break; }
          }
          if (!hit) return ok({ focused: false, reason: 'tensor not found', requested: name, module: modId });
          d.app.select(hit.module, name);
          // React 상태 반영을 기다린 뒤 스냅샷 (즉시 읽으면 selected가 null로 나온다)
          return new Promise(function (resolve) {
            setTimeout(function () {
              var s = d.app.state;
              resolve(ok({ focused: true, module: hit.module, tensor: name, cat: hit.cat, format: hit.format, view: s.view, precision: s.precision, selected: s.selected, selected_tensor: s.tensor }));
            }, 200);
          });
        }).catch(err);
      }
    },
    {
      name: 'get_view_state',
      description: 'Report what the user is currently looking at in the atlas: view mode, precision, layout, selected module/tensor, filter, and animation state. Use it to answer "what am I looking at" or to stay in sync with the user.',
      inputSchema: { type: 'object', properties: {}, additionalProperties: false },
      annotations: { readOnlyHint: true },
      execute: function () {
        return waitForAtlas().then(function (d) {
          var s = d.app.state;
          return ok({
            view: s.view, precision: s.precision, layout: s.layout, filter: s.filter,
            selected_module: s.selected, selected_tensor: s.tensor, hover_tensor: s.hoverTensor,
            playing: s.playing, timeline_time: s.time, expert_view: s.expertView, detail_layout: s.detailLayout
          });
        }).catch(err);
      }
    },
    {
      name: 'list_benchmarks',
      description: 'List every reported evaluation on this atlas model card (reasoning, agentic, visual) with each model\'s score and rank, so an agent can choose a benchmark to compare. Use compare_models for a focused head-to-head.',
      inputSchema: {
        type: 'object',
        properties: { category: { type: 'string', description: 'Optional filter: Reasoning, Agentic or Visual.' } },
        additionalProperties: false
      },
      annotations: { readOnlyHint: true },
      execute: function (a) {
        a = a || {};
        return waitForAtlas().then(function (d) {
          var t = benchTable(d);
          var rows = t.rows.filter(function (r) {
            return !a.category || String(r.category).toLowerCase() === String(a.category).toLowerCase();
          });
          return ok({
            models: t.models,
            count: rows.length,
            metric_note: METRIC_NOTE,
            benchmarks: rows.map(function (r) {
              return { name: r.name, category: r.category, ranking: ranked(r.values, t.models).ranking };
            })
          });
        }).catch(err);
      }
    },
    {
      name: 'compare_models',
      description: 'Compare models on one reported benchmark of this model card. Give a benchmark name (e.g. "DeepSWE v1.1") and optionally the models to compare (e.g. ["Qwen3.8-Flash-Next (this atlas)", "GLM-5.3"]); returns each score with rank and delta vs the best reported score, plus the metric caveat.',
      inputSchema: {
        type: 'object',
        properties: {
          benchmark: { type: 'string', description: 'Benchmark name from list_benchmarks, e.g. "DeepSWE v1.1" (partial match allowed).' },
          models: { type: 'array', items: { type: 'string' }, description: 'Optional subset of models to focus the comparison on (partial names allowed).' }
        },
        required: ['benchmark'],
        additionalProperties: false
      },
      annotations: { readOnlyHint: true },
      execute: function (a) {
        a = a || {};
        return waitForAtlas().then(function (d) {
          var t = benchTable(d);
          if (!a.benchmark) return ok({ error: 'benchmark is required', available: t.rows.map(function (r) { return r.name; }) });
          var row = findRow(t, a.benchmark);
          if (!row) return ok({ error: 'benchmark not found: ' + a.benchmark, available: t.rows.map(function (r) { return r.name; }) });
          var r = ranked(row.values, t.models);
          var focus = null;
          if (a.models && a.models.length) {
            focus = a.models.map(function (m) {
              var hit = findModel(r.ranking, m);
              return hit || { model: m, error: 'model not in table' };
            });
            if (focus.length === 2 && !focus[0].error && !focus[1].error && focus[0].score != null && focus[1].score != null) {
              var hi = focus[0].score >= focus[1].score ? focus[0] : focus[1];
              var lo = focus[0].score >= focus[1].score ? focus[1] : focus[0];
              focus.push({
                head_to_head: hi.model + ' vs ' + lo.model,
                delta: Math.round((hi.score - lo.score) * 10) / 10,
                relative_percent: Math.round(((hi.score - lo.score) / lo.score) * 1000) / 10,
                leader: hi.model
              });
            }
          }
          return ok({
            benchmark: row.name,
            category: row.category,
            reported_models: r.reported,
            ranking: r.ranking,
            selected: focus,
            metric_note: METRIC_NOTE
          });
        }).catch(err);
      }
    }
  ];

  function register(list) {
    // registerTool 우선, 없으면 provideContext({tools}) 로 폴백 (API 표면 변동 대응)
    if (typeof mc.registerTool !== 'function' && typeof mc.provideContext === 'function') {
      try {
        mc.provideContext({ tools: list });
        window.__WEBMCP_STATUS = 'registered (provideContext)';
        try { console.log('[webmcp] atlas tools provided via provideContext:', list.length); } catch (e) {}
      } catch (e) {
        window.__WEBMCP_STATUS = 'provideContext-failed';
        try { console.warn('[webmcp] provideContext failed', e); } catch (e2) {}
      }
      return;
    }
    var i = 0;
    (function next() {
      if (i >= list.length) {
        window.__WEBMCP_STATUS = 'registered (' + list.length + ' tools)';
        try { console.log('[webmcp] atlas tools registered:', list.length, list.map(function (t) { return t.name; })); } catch (e) {}
        return;
      }
      var tool = list[i++];
      try {
        var p = mc.registerTool(tool);
        if (p && typeof p.then === 'function') { p.then(next, next); } else { next(); }
      } catch (e) {
        try { console.warn('[webmcp] registerTool failed for', tool.name, e); } catch (e2) {}
        next();
      }
    })();
  }

  // 디버깅/자동검증용 진입점 (inspector 확장 없이도 호출 가능)
  window.__WEBMCP_ATLAS = {
    tools: TOOLS,
    call: function (name, args) {
      for (var i = 0; i < TOOLS.length; i++) {
        if (TOOLS[i].name === name) return Promise.resolve(TOOLS[i].execute(args || {}));
      }
      return Promise.reject(new Error('unknown tool: ' + name));
    }
  };

  register(TOOLS);
})();
</script>
